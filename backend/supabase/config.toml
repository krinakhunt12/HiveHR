project_id = "hivehr"

[api]
enabled = true
port = 55421
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55432
major_version = 17

[studio]
enabled = true
port = 55423
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 55424

[analytics]
enabled = true
port = 55437

[storage]
enabled = true
file_size_limit = "50MiB"

# ─── Edge Functions ────────────────────────────────────────────────────────────
# verify_jwt = false for ALL functions.
# All auth is handled inside each function via supabase.auth.getUser()
# which contacts the auth server directly (supports ES256 asymmetric keys).

[functions.auth]
verify_jwt = false

[functions.admin]
verify_jwt = false

[functions.profile]
verify_jwt = false

[functions.employee]
verify_jwt = false

[functions.attendance]
verify_jwt = false

[functions.leave]
verify_jwt = false

[functions.policies]
verify_jwt = false

[functions.company]
verify_jwt = false

[functions.departments]
verify_jwt = false

[functions.dashboard]
verify_jwt = false
