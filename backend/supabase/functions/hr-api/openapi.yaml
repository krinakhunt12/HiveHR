openapi: 3.0.3
info:
  title: HiveHR hr-api
  version: 1.0.0
  description: Supabase Edge Function API schema for HiveHR backend.
servers:
  - url: /functions/v1/hr-api
    description: Supabase Edge Functions base path
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    HealthResponse:
      type: object
      properties:
        ok:
          type: boolean
        service:
          type: string
        timestamp:
          type: string
          format: date-time
      required: [ok, service, timestamp]
    Employee:
      type: object
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        department_id:
          type: string
          format: uuid
          nullable: true
        user_id:
          type: string
          format: uuid
          nullable: true
        employee_code:
          type: string
        full_name:
          type: string
        designation:
          type: string
        employment_type:
          type: string
          enum: [full_time, part_time, contract, intern]
        joined_on:
          type: string
          format: date
        salary:
          type: number
          nullable: true
        status:
          type: string
          enum: [active, inactive, on_leave, terminated]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EmployeeListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Employee'
      required: [data]
    EmployeeSingleResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Employee'
      required: [data]
    EmployeeCreateRequest:
      type: object
      required: [company_id, employee_code, full_name, designation, joined_on]
      properties:
        company_id:
          type: string
          format: uuid
        department_id:
          type: string
          format: uuid
          nullable: true
        user_id:
          type: string
          format: uuid
          nullable: true
        employee_code:
          type: string
        full_name:
          type: string
        designation:
          type: string
        employment_type:
          type: string
          enum: [full_time, part_time, contract, intern]
        joined_on:
          type: string
          format: date
        salary:
          type: number
          nullable: true
        status:
          type: string
          enum: [active, inactive, on_leave, terminated]
    EmployeeUpdateRequest:
      type: object
      properties:
        company_id:
          type: string
          format: uuid
        department_id:
          type: string
          format: uuid
          nullable: true
        user_id:
          type: string
          format: uuid
          nullable: true
        employee_code:
          type: string
        full_name:
          type: string
        designation:
          type: string
        employment_type:
          type: string
          enum: [full_time, part_time, contract, intern]
        joined_on:
          type: string
          format: date
        salary:
          type: number
          nullable: true
        status:
          type: string
          enum: [active, inactive, on_leave, terminated]
    AttendanceLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        employee_id:
          type: string
          format: uuid
        attendance_date:
          type: string
          format: date
        check_in_at:
          type: string
          format: date-time
          nullable: true
        check_out_at:
          type: string
          format: date-time
          nullable: true
        work_minutes:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AttendanceListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceLog'
      required: [data]
    AttendanceCheckInRequest:
      type: object
      required: [employee_id, company_id]
      properties:
        employee_id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        attendance_date:
          type: string
          format: date
    AttendanceCheckOutRequest:
      type: object
      required: [employee_id]
      properties:
        employee_id:
          type: string
          format: uuid
        attendance_date:
          type: string
          format: date
    AttendanceMutationResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AttendanceLog'
        message:
          type: string
      required: [data, message]
    Policy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        title:
          type: string
        policy_type:
          type: string
        content:
          type: string
        effective_from:
          type: string
          format: date
          nullable: true
        is_active:
          type: boolean
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PolicyListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Policy'
      required: [data]
    PolicySingleResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Policy'
      required: [data]
    PolicyCreateRequest:
      type: object
      required: [company_id, title, content]
      properties:
        company_id:
          type: string
          format: uuid
        title:
          type: string
        policy_type:
          type: string
        content:
          type: string
        effective_from:
          type: string
          format: date
          nullable: true
        is_active:
          type: boolean
    PolicyUpdateRequest:
      type: object
      properties:
        title:
          type: string
        policy_type:
          type: string
        content:
          type: string
        effective_from:
          type: string
          format: date
          nullable: true
        is_active:
          type: boolean
    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        '200':
          description: Service health payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /employees:
    get:
      summary: List employees
      operationId: listEmployees
      parameters:
        - in: query
          name: company_id
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Employees list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeListResponse'
        '400':
          description: Query failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Add employee
      operationId: createEmployee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeCreateRequest'
      responses:
        '201':
          description: Employee created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeSingleResponse'
        '400':
          description: Validation or insert error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /employees/{employee_id}:
    parameters:
      - in: path
        name: employee_id
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get employee
      operationId: getEmployee
      responses:
        '200':
          description: Single employee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeSingleResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update employee
      operationId: updateEmployee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeUpdateRequest'
      responses:
        '200':
          description: Updated employee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeSingleResponse'
        '400':
          description: Update failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete employee
      operationId: deleteEmployee
      responses:
        '200':
          description: Employee deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Delete failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /attendance:
    get:
      summary: List attendance logs
      operationId: listAttendance
      parameters:
        - in: query
          name: company_id
          required: false
          schema:
            type: string
            format: uuid
        - in: query
          name: employee_id
          required: false
          schema:
            type: string
            format: uuid
        - in: query
          name: attendance_date
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Attendance list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceListResponse'
        '400':
          description: Query failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /attendance/check-in:
    post:
      summary: Check in employee
      operationId: checkInAttendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceCheckInRequest'
      responses:
        '200':
          description: Checked in on existing day row
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceMutationResponse'
        '201':
          description: Checked in with newly created row
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceMutationResponse'
        '400':
          description: Validation or query error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Already checked in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /attendance/check-out:
    post:
      summary: Check out employee
      operationId: checkOutAttendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceCheckOutRequest'
      responses:
        '200':
          description: Checked out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceMutationResponse'
        '400':
          description: Validation or missing check-in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Already checked out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /policies:
    get:
      summary: List company policies
      operationId: listPolicies
      parameters:
        - in: query
          name: company_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Policies list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyListResponse'
        '400':
          description: Validation or query error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create company policy
      operationId: createPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyCreateRequest'
      responses:
        '201':
          description: Created policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicySingleResponse'
        '400':
          description: Validation or insert error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /policies/{policy_id}:
    parameters:
      - in: path
        name: policy_id
        required: true
        schema:
          type: string
          format: uuid
    put:
      summary: Update policy
      operationId: updatePolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyUpdateRequest'
      responses:
        '200':
          description: Updated policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicySingleResponse'
        '400':
          description: Update error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete policy
      operationId: deletePolicy
      responses:
        '200':
          description: Policy deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Delete error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
